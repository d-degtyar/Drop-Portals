[package]
name = "drop-portals"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Плаваючі вікна-портали в папки"
build = "build.rs"

[[bin]]
name = "DropPortals"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
rfd = "0.17"
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# збирання запускається на машині-збирачі, тож ціль перевіряє сам build.rs
[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = "0.37"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
