name: Release

# Publishes v<version from Cargo.toml>, creating the tag if needed.
# Run it by pushing a v* tag or with the "Run workflow" button.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version from Cargo.toml
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo test
      - run: cargo build --release
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v heading="## $version " 'index($0, "## ") == 1 { take = index($0, heading) == 1; next } take' \
            CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Drop Portals v${{ steps.version.outputs.version }}
          body_path: notes.md
          files: target/release/DropPortals.exe
